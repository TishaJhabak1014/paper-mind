spring.application.name=papermind
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/researchdb}
spring.datasource.username=${DB_USERNAME:researchadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

google.ai.api-key=${GOOGLE_AI_API_KEY:}
google.ai.model=${GOOGLE_AI_MODEL:gemini-3.8-flash}
google.ai.fallback-model=${GOOGLE_AI_FALLBACK_MODEL:gemini-3.5-flash-lite}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.cache.summary-ttl=${SUMMARY_CACHE_TTL:30d}
app.cache.semantic-search-ttl=${SEMANTIC_SEARCH_CACHE_TTL:6h}
app.cache.semantic-citation-ttl=${SEMANTIC_CITATION_CACHE_TTL:1h}
app.cache.abstract-source-ttl=${ABSTRACT_SOURCE_CACHE_TTL:30d}
app.summary.prompt-version=${SUMMARY_PROMPT_VERSION:2}
app.rate-limit.semantic-scholar-interval-ms=${SEMANTIC_SCHOLAR_MIN_REQUEST_INTERVAL_MS:1500}
app.rate-limit.gemini-interval-ms=${GEMINI_MIN_REQUEST_INTERVAL_MS:4000}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:90}
app.rate-limit.abstract-source-interval-ms=${ABSTRACT_SOURCE_MIN_REQUEST_INTERVAL_MS:1000}
