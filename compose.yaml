services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: researchdb
      POSTGRES_USER: researchadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - papermind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchadmin -d researchdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - papermind-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://database:5432/researchdb
      DB_USERNAME: researchadmin
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DDL_AUTO: update
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL:-gemini-3.8-flash}
      GOOGLE_AI_FALLBACK_MODEL: ${GOOGLE_AI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      SEMANTIC_SCHOLAR_MIN_REQUEST_INTERVAL_MS: ${SEMANTIC_SCHOLAR_MIN_REQUEST_INTERVAL_MS:-1500}
      GEMINI_MIN_REQUEST_INTERVAL_MS: ${GEMINI_MIN_REQUEST_INTERVAL_MS:-4000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  papermind-postgres:
  papermind-redis:
